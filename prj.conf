# Enable logging so LOG_INF() calls print
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=y

# Larger main stack for our demo
CONFIG_MAIN_STACK_SIZE=4096

# Enable ring buffer subsystem (used by future UART driver integration)
CONFIG_RING_BUFFER=y

# Framer module log level (0=off .. 4=debug)
CONFIG_FRAMER_LOG_LEVEL=3

# Thread naming helps debug output
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
